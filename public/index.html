<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101216">
  <title>Pokémon Cristal+</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cristal+">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="app">
    <section id="screen-wrap">
      <canvas id="screen" width="160" height="144" aria-label="Pantalla del juego"></canvas>
      <button id="menu-button" type="button" aria-label="Menú">☰</button>
      <div id="welcome">
        <h1>Pokémon Cristal+</h1>
        <p>Elige tu ROM de Pokémon Cristal para empezar. Se guarda en este dispositivo y no se envía a ningún sitio.</p>
        <!-- No "accept": iOS greys out files whose extension it doesn't know (.gbc). -->
        <label class="primary">Elegir ROM<input id="rom-input" type="file" hidden></label>
        <p id="error" role="alert" hidden></p>
      </div>
    </section>
    <aside id="install-hint" hidden>
      <span>Para no perder tu partida: Compartir → Añadir a pantalla de inicio</span>
      <button type="button" aria-label="Cerrar">✕</button>
    </aside>
    <div id="controls"></div>
  </main>
  <div id="menu" class="overlay" hidden><ul></ul></div>
  <noscript><p>Esta aplicación necesita JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
